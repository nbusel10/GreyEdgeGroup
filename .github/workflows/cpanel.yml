name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://thegreyedge.buselmeier.com
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # cPanel for thegreyedge.buselmeier.com tracks main. Fast-forward only.
      - name: Publish dist to main
        run: bash .github/scripts/publish-dist-branch.sh main

      - name: Update thegreyedge.buselmeier.com
        env:
          CPANEL_DEPLOY_URL: ${{ secrets.CPANEL_DEPLOY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CPANEL_DEPLOY_URL}" ]; then
            echo "CPANEL_DEPLOY_URL is not set."
            echo "In cPanel: Git Version Control → Manage → Pull or Deploy → copy the deployment URL."
            echo "In GitHub: Settings → Secrets and variables → Actions → New repository secret → CPANEL_DEPLOY_URL."
            exit 1
          fi
          code="$(curl -sS -o /tmp/cpanel-deploy.txt -w '%{http_code}' -X POST "$CPANEL_DEPLOY_URL" \
            -H 'Content-Type: application/json' \
            --data '{"ref":"refs/heads/main"}')"
          echo "cPanel responded ${code}"
          sed -n '1,40p' /tmp/cpanel-deploy.txt
          case "$code" in
            2*) ;;
            *) exit 1 ;;
          esac
