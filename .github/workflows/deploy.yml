name: Deploy site

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (staging or production)
        required: true
        type: string
      dist_branch:
        description: Branch that stores the built site
        required: true
        type: string
      site_url:
        description: Public URL recorded on the GitHub environment
        required: true
        type: string
      server_dir:
        description: Document root on the cPanel account, relative to the FTP home
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.site_url }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # production stays indexable; staging rewrites robots after the build
          SITE_ENVIRONMENT: ${{ inputs.environment }}
        run: pnpm build

      # Upload while dist/ still exists. Publishing checks out the dist branch
      # and removes this worktree, including dist/.
      - name: Upload to ${{ inputs.server_dir }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ inputs.server_dir }}
          dangerous-clean-slate: false

      # Fast-forward only. cPanel cannot update unless this branch stays a
      # descendant of the checkout it already has.
      - name: Publish dist to ${{ inputs.dist_branch }}
        run: bash .github/scripts/publish-dist-branch.sh ${{ inputs.dist_branch }}
