name: Production

# Manual only until go-live. Does not run on push, and does not touch the
# thegreyedge.buselmeier.com checkout (that clone tracks main, not live).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: production
      dist_branch: live
      site_url: https://greyedgegroup.com
