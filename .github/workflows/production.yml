name: Production

# Manual only. Does not run on push. Public site is https://greyedgegroup.com.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: production
      dist_branch: live
      site_url: https://greyedgegroup.com
      server_dir: /public_html/greyedgegroup.com/
