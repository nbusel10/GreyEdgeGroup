name: Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: staging
      # cPanel document root: /home/buselmei/public_html/staging.greyedgegroup.com
      # That folder should clone this repo's main branch. main is the built site.
      dist_branch: main
      site_url: https://staging.greyedgegroup.com
      server_dir: /public_html/staging.greyedgegroup.com/
